name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its run; every commit on main
  # keeps its own.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The main ruleset requires the check named "test". The check takes the
  # job's ID, so keep the ID and give the job no name and no matrix.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          package-manager-cache: false
      # pnpm's version comes from packageManager in router/package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: router/package.json
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: router
      - run: pnpm test
        working-directory: router
      - run: pnpm typecheck
        working-directory: router
      - run: pnpm fmt:check
        working-directory: router
      - run: node --test router-core.test.js
        working-directory: docs/research
      - name: Check that the manifest and lockfile are unchanged
        run: git diff --exit-code -- router/package.json router/pnpm-lock.yaml
