name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: router/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: router
      - run: pnpm test
        working-directory: router
      - run: pnpm typecheck
        working-directory: router
      - run: pnpm dlx prettier@3 --check .
        working-directory: router
      - run: node --test router-core.test.js
        working-directory: research
